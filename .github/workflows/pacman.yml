name: Generate Daily Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine graph mode
        id: determine-mode
        run: |
          day=$(date +%-d)
          if [ $((day % 2)) -eq 0 ]; then
            echo "mode=pacman" >> "$GITHUB_OUTPUT"
          else
            echo "mode=snake" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate Pacman graph
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Move Pacman graph to dist
        if: steps.determine-mode.outputs.mode == 'pacman'
        run: mv dist/pacman-contribution-graph-dark.svg dist/contribution-graph.svg

      - name: Generate Snake graph
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution graph [${{ steps.determine-mode.outputs.mode }}]"
          file_pattern: dist/contribution-graph.svg
          commit_options: "--allow-empty"
          commit_user_name: Iamvinnie254
          commit_user_email: 168260260+Iamvinnie254@users.noreply.github.com
          commit_author: Iamvinnie254 <168260260+Iamvinnie254@users.noreply.github.com>
