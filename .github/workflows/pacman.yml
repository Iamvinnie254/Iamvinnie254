name: Generate Daily Graph

on:
  push:
    paths:
      - ".github/workflows/pacman.yml"
      - "README.md"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Graph to generate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - pacman
          - snake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine graph mode
        id: determine-mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          day="$(date -u +%-d)"
          mode="${REQUESTED_MODE:-}"

          if [[ -z "$mode" || "$mode" == "auto" ]]; then
            if (( day % 2 == 0 )); then
              mode="pacman"
            else
              mode="snake"
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Prepare output directory
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Generate Pacman graph
        if: steps.determine-mode.outputs.mode == 'pacman'
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Move Pacman graph to the published path
        if: steps.determine-mode.outputs.mode == 'pacman'
        shell: bash
        run: |
          set -euo pipefail

          graph="$(find . -type f -name 'pacman-contribution-graph-dark.svg' -print -quit)"
          if [[ -z "$graph" ]]; then
            echo "Pacman graph was not generated. Generated SVG files:"
            find . -type f -name '*.svg' -print || true
            exit 1
          fi

          mv "$graph" dist/contribution-graph.svg

      - name: Generate Snake graph
        if: steps.determine-mode.outputs.mode == 'snake'
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/contribution-graph.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated graph
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/contribution-graph.svg
          echo "Generated graph:"
          ls -lh dist/contribution-graph.svg

      - name: Commit and push generated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update contribution graph [${{ steps.determine-mode.outputs.mode }}]"
          file_pattern: dist/contribution-graph.svg
          commit_user_name: Iamvinnie254
          commit_user_email: 168260260+Iamvinnie254@users.noreply.github.com
          commit_author: Iamvinnie254 <168260260+Iamvinnie254@users.noreply.github.com>
